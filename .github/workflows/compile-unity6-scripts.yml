name: Compile MVL Scripts Unity 6
# Final compile: adaptive NGUI + API25 + IL2CPP linker
# Canonical head compile after linker/resource validation
# Verify anti-cheat and HTML UI fallbacks
# Final regenerated project verification
# Verify runtime RMI and transport fixes
# Trigger regenerated project compile #3
# Compile regenerated project with safe-area fixes
# Trigger regenerated project compile #2
# Triggered after regenerated Unity 6 recovery

on:
  push:
    branches: [mvl-unity6-recovery]
    paths:
      - "unity-project/Assets/**/*.cs"
      - ".github/workflows/compile-unity6-scripts.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            unity-project/Assets/Scripts
            unity-project/Assets/Plugins
            unity-project/Assets/Editor
            .github/workflows/compile-unity6-scripts.yml
          sparse-checkout-cone-mode: true
      - name: Compile C#
        run: |
          set -euo pipefail
          IMAGE=unityci/editor:ubuntu-6000.3.25f1-android-3
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/src" -w /src --entrypoint bash "$IMAGE" -lc '
            set -euo pipefail
            DOTNET=/opt/unity/Editor/Data/NetCoreRuntime/dotnet
            CSC=/opt/unity/Editor/Data/DotNetSdkRoslyn/csc.dll
            REF=/opt/unity/Editor/Data/UnityReferenceAssemblies/unity-4.8-api
            UMAN=/opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer/Variations/mono/Managed

            find unity-project/Assets/Scripts unity-project/Assets/Plugins -type f -name "*.cs" ! -path "*/Editor/*" | sort > /tmp/sources.txt
            : > /tmp/refs.rsp
            for f in "$REF"/*.dll "$REF"/Facades/*.dll "$UMAN"/*.dll; do
              [ -f "$f" ] && echo "-r:$f" >> /tmp/refs.rsp
            done

            sed "s#^#/src/#" /tmp/sources.txt > /tmp/sources-abs.txt
            {
              echo "-nologo"
              echo "-target:library"
              echo "-langversion:latest"
              echo "-unsafe+"
              echo "-define:UNITY_6000_3_OR_NEWER,UNITY_6000_0_OR_NEWER,UNITY_ANDROID,UNITY_64,ENABLE_MONO,NET_4_6"
              echo "-out:/tmp/Assembly-CSharp-check.dll"
              cat /tmp/refs.rsp
              cat /tmp/sources-abs.txt
            } > /tmp/compile.rsp

            set +e
            "$DOTNET" "$CSC" @/tmp/compile.rsp 2>&1 | tee /src/unity6-compile.log
            status=${PIPESTATUS[0]}
            set -e
            grep -E "error CS[0-9]+" /src/unity6-compile.log | sed -E "s#^/src/##" | tee /src/unity6-errors.txt || true
            if [ "$status" -ne 0 ]; then exit "$status"; fi

            # Compile Assets/Editor as a second assembly so UnityEditor build/validation
            # code is checked without requiring a Unity license.
            MAN=/opt/unity/Editor/Data/Managed
            ANDROID_EXT=/opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer/UnityEditor.Android.Extensions.dll
            find unity-project/Assets/Editor -type f -name "*.cs" | sort > /tmp/editor-sources.txt
            if [ -s /tmp/editor-sources.txt ]; then
              : > /tmp/editor-refs.rsp
              for f in "$REF"/*.dll "$REF"/Facades/*.dll "$MAN"/*.dll "$MAN"/UnityEngine/*.dll "$ANDROID_EXT"; do
                [ -f "$f" ] && echo "-r:$f" >> /tmp/editor-refs.rsp
              done
              echo "-r:/tmp/Assembly-CSharp-check.dll" >> /tmp/editor-refs.rsp
              sed "s#^#/src/#" /tmp/editor-sources.txt > /tmp/editor-sources-abs.txt
              {
                echo "-nologo"
                echo "-target:library"
                echo "-langversion:latest"
                echo "-unsafe+"
                echo "-define:UNITY_EDITOR,UNITY_EDITOR_LINUX,UNITY_6000_3_OR_NEWER,UNITY_6000_0_OR_NEWER,UNITY_ANDROID,UNITY_64,NET_4_6"
                echo "-out:/tmp/Assembly-CSharp-Editor-check.dll"
                cat /tmp/editor-refs.rsp
                cat /tmp/editor-sources-abs.txt
              } > /tmp/editor-compile.rsp

              set +e
              "$DOTNET" "$CSC" @/tmp/editor-compile.rsp 2>&1 | tee /src/unity6-editor-compile.log
              editor_status=${PIPESTATUS[0]}
              set -e
              grep -E "error CS[0-9]+" /src/unity6-editor-compile.log | sed -E "s#^/src/##" | tee /src/unity6-editor-errors.txt || true
              exit "$editor_status"
            fi
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity6-script-compile
          path: |
            unity6-compile.log
            unity6-errors.txt
            unity6-editor-compile.log
            unity6-editor-errors.txt
          retention-days: 7
