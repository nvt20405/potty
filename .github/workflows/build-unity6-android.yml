name: Build MVL Unity 6 Android
# Verify IL2CPP recovery build

on:
  push:
    branches: [mvl-unity6-recovery]
    paths:
      - "unity-project/**"
      - ".github/workflows/build-unity6-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull Git LFS assets
        run: |
          git lfs pull
          test -f unity-project/ProjectSettings/ProjectVersion.txt
          cat unity-project/ProjectSettings/ProjectVersion.txt
          du -sh unity-project

      - name: Static model validation
        run: |
          python3 tools/validate_unity_project.py unity-project

      - name: Unity credential status
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "UNITY_LICENSE configured"; else echo "UNITY_LICENSE not configured"; fi
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then echo "Unity account credentials configured"; else echo "Unity account credentials not configured"; fi

      - name: Build Android APK with Unity 6.3 LTS
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-project
          unityVersion: 6000.3.25f1
          targetPlatform: Android
          buildMethod: MVLUnity6Build.BuildAndroid
          versioning: None

      - name: Locate APK
        if: always()
        run: |
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%p %s bytes\n' | tee apk-files.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MongVoLam-Unity6-Android
          path: |
            unity-project/Builds/*.apk
            build/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity6-build-diagnostics
          path: |
            apk-files.txt
            unity-project/Logs
          if-no-files-found: ignore
          retention-days: 7
