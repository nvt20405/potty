name: Recover MVL Unity Project

on:
  push:
    branches: [mvl-unity6-recovery]
    paths:
      - ".github/workflows/recover-mvl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download source APK from Google Drive
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check -q gdown
          mkdir -p work
          gdown "https://drive.google.com/uc?id=1x5AoDsrCh_zFI1WRAHG0coSh7HMBdAV5" -O work/mongvolam_merged_v27.apk
          sha256sum work/mongvolam_merged_v27.apk | tee work/apk.sha256

      - name: Download AssetRipper 2.0.0
        run: |
          set -euxo pipefail
          mkdir -p work/assetripper
          wget -q "https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_linux_x64.tar.xz" -O work/assetripper.tar.xz
          tar -xJf work/assetripper.tar.xz -C work/assetripper
          chmod +x work/assetripper/AssetRipper.GUI.Free

      - name: Recover Unity project with AssetRipper
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          AR="$ROOT/work/assetripper/AssetRipper.GUI.Free"
          APK="$ROOT/work/mongvolam_merged_v27.apk"
          OUT="$ROOT/work/recovered"
          mkdir -p "$OUT"

          "$AR" --headless --port 5454 --log --log-path "$ROOT/work/assetripper.log" > "$ROOT/work/assetripper.stdout.log" 2>&1 &
          AR_PID=$!

          ok=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:5454/" >/dev/null; then ok=1; break; fi
            if ! kill -0 "$AR_PID" 2>/dev/null; then
              cat work/assetripper.stdout.log || true
              exit 1
            fi
            sleep 2
          done
          test "$ok" = 1

          echo "Switching AssetRipper to decompiled source mode"
          curl -fsS -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "ScriptContentLevel=Level2" \
            --data-urlencode "ScriptExportMode=Decompiled" \
            --data-urlencode "EnableStaticMeshSeparation=on" \
            --data-urlencode "PreferOriginalTextureExtension=on" \
            "http://127.0.0.1:5454/Settings/Update" -o /dev/null

          curl -fsS -X POST             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "Path=$APK"             "http://127.0.0.1:5454/LoadFile" -o /dev/null

          curl -fsS -X POST             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "Path=$OUT"             --data-urlencode "CreateSubfolder=false"             "http://127.0.0.1:5454/Export/UnityProject" -o /dev/null

          kill "$AR_PID" || true
          wait "$AR_PID" || true

          test -d "$OUT/ExportedProject/Assets"
          test -d "$OUT/ExportedProject/ProjectSettings"

      - name: Migrate recovered project to Unity 6
        run: |
          set -euxo pipefail
          PROJ=work/recovered/ExportedProject
          python3 tools/port_to_unity6.py "$PROJ"
          python3 tools/validate_unity_project.py "$PROJ" | tee work/unity6-validation.txt

      - name: Inventory and split archive
        run: |
          set -euxo pipefail
          PROJ=work/recovered/ExportedProject
          {
            echo "## Project version"
            cat "$PROJ/ProjectSettings/ProjectVersion.txt"
            echo "## Size"
            du -sh work/recovered
            echo "## Scripts"
            find "$PROJ/Assets" -type f -name '*.cs' | wc -l
            echo "## Scenes"
            find "$PROJ/Assets" -type f -name '*.unity' | wc -l
            echo "## Prefabs"
            find "$PROJ/Assets" -type f -name '*.prefab' | wc -l
            echo "## Top-level asset sizes"
            du -sh "$PROJ/Assets"/* 2>/dev/null | sort -h
          } | tee work/recovery-inventory.txt

          tar -C work -czf work/mvl-recovered.tar.gz recovered recovery-inventory.txt apk.sha256
          mkdir -p work/chunks
          split -b 80m -d -a 2 work/mvl-recovered.tar.gz work/chunks/part-
          ls -lh work/chunks

      - name: Push migrated Unity project to branch
        run: |
          set -euxo pipefail
          PROJ=work/recovered/ExportedProject
          rm -rf unity-project
          mkdir -p unity-project
          cp -a "$PROJ"/. unity-project/

          git lfs install --local
          git lfs track "*.anim" "*.asset" "*.png" "*.jpg" "*.jpeg" "*.tga" "*.psd" "*.mp3" "*.wav" "*.ogg" "*.ttf" "*.otf" "*.bytes" "*.dll" "*.so"
          git config user.name "MVL Unity Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .gitattributes unity-project
          git commit -m "feat: recover and migrate Mộng Võ Lâm project to Unity 6.3 LTS" || true
          git push origin HEAD:mvl-unity6-recovery

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovery-metadata
          path: |
            work/recovery-inventory.txt
            work/assetripper.log
            work/assetripper.stdout.log
            work/apk.sha256
            work/unity6-validation.txt
          retention-days: 7

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovered-part-00
          path: work/chunks/part-00
          compression-level: 0
          retention-days: 7
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovered-part-01
          path: work/chunks/part-01
          compression-level: 0
          retention-days: 7
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovered-part-02
          path: work/chunks/part-02
          compression-level: 0
          retention-days: 7
      - name: Upload chunk 03
        if: ${{ hashFiles('work/chunks/part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovered-part-03
          path: work/chunks/part-03
          compression-level: 0
          retention-days: 7
      - name: Upload chunk 04
        if: ${{ hashFiles('work/chunks/part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mvl-recovered-part-04
          path: work/chunks/part-04
          compression-level: 0
          retention-days: 7
